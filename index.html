<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Düşünce Ağı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif&display=swap">
<style>
/* Layout: graph canvas on the left, composer and detail stacked on the right; phones stack composer, graph, detail. */
:root{
  --bg:#EDF0EF; --surface:#FFFFFF; --stage:#F7F9F8; --fg:#14201D; --muted:#5B6A66; --line:#D3DBD8;
  --accent:#0A7C76; --accent-fg:#FFFFFF; --danger:#B3261E;
  color-scheme:light;
  --ts:56%; --tl:38%; --es:60%; --el:84%; --on-node:#FFFFFF;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1413; --surface:#151D1C; --stage:#111817; --fg:#E4EEEB; --muted:#8DA09B; --line:#2A3835;
    --accent:#3EC5BB; --accent-fg:#04211F; --danger:#FF8F85;
    --ts:58%; --tl:64%; --es:40%; --el:26%; --on-node:#0B1514;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1413; --surface:#151D1C; --stage:#111817; --fg:#E4EEEB; --muted:#8DA09B; --line:#2A3835;
  --accent:#3EC5BB; --accent-fg:#04211F; --danger:#FF8F85;
  --ts:58%; --tl:64%; --es:40%; --el:26%; --on-node:#0B1514;
  color-scheme:dark;
}

[hidden]{display:none!important}
*{box-sizing:border-box}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.auth{max-width:420px;margin:8vh auto 0;padding:24px}
.auth h2{font:400 30px/1.1 var(--serif);margin:0 0 6px}
.auth p{color:var(--muted);margin:0 0 8px;font-size:14px}
.auth label{display:block;font-size:13px;font-weight:500;margin:14px 0 4px}
.auth input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.auth .actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.5 var(--sans);
  padding-block:20px 36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:16px}
h1{font:400 36px/1.05 var(--serif);letter-spacing:-.01em;margin:0}
.stats{font:500 12px var(--mono);color:var(--muted)}

.grid{
  display:grid;gap:16px;align-items:start;
  grid-template-columns:minmax(0,1fr) 360px;
  grid-template-areas:"stage composer" "stage detail";
}
@media (max-width:860px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"composer" "stage" "detail"}
}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}

/* Stage */
.stage{grid-area:stage;min-width:0;overflow:hidden}
.topics{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.empty-chips{font-size:13px;color:var(--muted);padding:5px 0}
.tchip{
  flex:none;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 11px;
  font-size:13px;font-weight:500;
}
.tchip:hover{border-color:var(--muted)}
.tchip .dot{width:9px;height:9px;border-radius:50%;background:hsl(var(--h) var(--ts) var(--tl))}
.tchip .n{font:500 11px var(--mono);color:var(--muted)}
.tchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tchip.on .n{color:var(--bg);opacity:.75}

.graph{
  position:relative;height:clamp(360px,64vh,680px);
  background-color:var(--stage);
  background-image:radial-gradient(var(--line) 1px,transparent 1px);
  background-size:22px 22px;
}
.graph svg{width:100%;height:100%;display:block;cursor:grab}
.graph svg:active{cursor:grabbing}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);font-size:14px;pointer-events:none}
.badge{
  position:absolute;left:12px;top:12px;max-width:min(300px,calc(100% - 130px));
  display:flex;flex-direction:column;gap:2px;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  font-size:12.5px;color:var(--muted);pointer-events:none;
}
.badge strong{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg)}
.reset{position:absolute;right:12px;top:12px}
.hint{
  display:flex;justify-content:space-between;gap:4px 16px;flex-wrap:wrap;
  padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);
}

.links line{stroke:var(--muted);stroke-opacity:.45;stroke-width:1.2;transition:stroke-opacity .2s}
.links line.dim{stroke-opacity:.07}
.node{cursor:pointer;transition:opacity .2s}
.node circle{stroke-width:2}
.node.topic circle{fill:hsl(var(--h) var(--ts) var(--tl));stroke:var(--stage)}
.node.entry circle{fill:hsl(var(--h) var(--es) var(--el));stroke:hsl(var(--h) var(--ts) var(--tl))}
.node.entry.orphan circle{fill:var(--surface);stroke:var(--muted);stroke-dasharray:3 2}
.node.sel circle{stroke:var(--fg);stroke-width:3}
.node.dim{opacity:.16}
.node text{pointer-events:none}
.node .count{font:500 11px var(--mono);fill:var(--on-node);text-anchor:middle;dominant-baseline:central}
.node .label{font:600 12.5px var(--sans);fill:var(--fg);text-anchor:middle;stroke:var(--stage);stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
.node.pending circle{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){
  .node.pending circle{animation:none;stroke-dasharray:3 2}
  .node,.links line{transition:none}
}

/* Composer */
.composer{grid-area:composer;min-width:0;padding:16px}
.composer textarea{
  display:block;width:100%;min-height:96px;resize:vertical;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.5;
}
.composer textarea::placeholder{color:var(--muted)}
.composer-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.note{font-size:12.5px;line-height:1.4;color:var(--muted);min-width:0}
.note.warn{color:var(--danger)}
.primary{
  flex:none;background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;
  padding:9px 18px;font-weight:600;cursor:pointer;
}
.primary:hover{filter:brightness(1.07)}

/* Detail */
.detail{grid-area:detail;min-width:0}
.detail h2{font:500 11.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.detail h3{font:400 30px/1.1 var(--serif);margin:10px 0 2px;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:13.5px;margin:6px 0}
.meta{font:500 12px var(--mono);color:var(--muted);margin:0 0 12px}
.etext{font-size:17px;line-height:1.5;margin:12px 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.section{margin-top:20px}
.item{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-top:1px solid var(--line);padding:12px 2px;
}
.item:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.item .tx{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;margin-bottom:6px;
}
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tag{
  display:inline-flex;align-items:center;gap:3px;
  font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;
  background:hsl(var(--h) var(--ts) var(--tl) / .14);
  border:1px solid hsl(var(--h) var(--ts) var(--tl) / .45);
}
.tag button{
  background:none;border:0;cursor:pointer;line-height:1;padding:0 0 0 3px;font-size:15px;color:var(--muted);
}
.tag button:hover{color:var(--fg)}
.state{font-size:12px;color:var(--muted)}
.state.warn{color:var(--danger)}
.inline{display:flex;gap:8px;margin:12px 0 0}
.inline input{
  flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 11px;
}
.btn{
  background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 13px;
  font-size:13px;font-weight:500;cursor:pointer;
}
.btn:hover{border-color:var(--muted)}
.btn.danger{color:var(--danger)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.back{margin-bottom:2px}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Düşünce Ağı</h1>
    <div class="who"><div class="stats" id="stats"></div><button class="btn" id="logout" type="button" hidden>Çıkış</button></div>
  </header>

  <section class="panel auth" id="auth" hidden>
    <h2>Giriş yap</h2>
    <p>Düşüncelerin yalnızca senin hesabında durur.</p>
    <form id="auth-form">
      <label for="auth-email">E-posta</label>
      <input id="auth-email" type="email" autocomplete="email" required>
      <label for="auth-pass">Şifre (en az 8 karakter)</label>
      <input id="auth-pass" type="password" autocomplete="current-password" minlength="8" required>
      <div class="actions">
        <button class="primary" type="submit">Giriş yap</button>
        <button class="btn" id="signup" type="button">Kayıt ol</button>
      </div>
      <p class="note" id="auth-msg" aria-live="polite" style="margin-top:12px"></p>
    </form>
  </section>

  <div id="app" hidden>
  <div class="grid">
    <section class="panel stage" aria-label="Düşünce ağı">
      <div class="topics" id="chips"></div>
      <div class="graph" id="graph">
        <svg id="svg" role="img" aria-label="Düşünce ağı grafiği"></svg>
        <div class="badge" id="badge" hidden>
          <strong>Örnek görünüm</strong>
          <span>İlk düşüncen eklenince bu örnekler kaybolur.</span>
        </div>
        <div class="overlay" id="overlay"></div>
        <button class="btn reset" id="reset" type="button">Görünümü sıfırla</button>
      </div>
      <div class="hint">
        <span>Sürükle, yakınlaştır, bir düğüme tıkla.</span>
        <span id="where"></span>
      </div>
    </section>

    <form class="panel composer" id="composer">
      <label for="entry-text" class="sr" style="position:absolute;left:-9999px">Yeni düşünce</label>
      <textarea id="entry-text" maxlength="2000" placeholder="Aklından ne geçiyor?"></textarea>
      <div class="composer-foot">
        <div class="note" id="note" aria-live="polite"></div>
        <button class="primary" type="submit">Ekle</button>
      </div>
    </form>

    <section class="detail" id="detail"></section>
  </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(function () {
  'use strict';

  var LS_KEY = 'dusunce-ag-v1';
  var HUES = [176, 262, 24, 208, 338, 92, 48, 300];
  var hasD3 = !!window.d3;

  var lc = function (s) { return String(s).toLocaleLowerCase('tr'); };
  var uniq = function (arr) {
    var out = [];
    arr.forEach(function (t) { if (!out.some(function (x) { return lc(x) === lc(t); })) out.push(t); });
    return out;
  };
  var idOf = function (x) { return typeof x === 'object' ? x.id : x; };

  function h(tag, props) {
    var el = document.createElement(tag);
    var p = props || {};
    Object.keys(p).forEach(function (k) {
      var v = p[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    Array.prototype.slice.call(arguments, 2).reduce(function (a, b) { return a.concat(b); }, []).forEach(function (kid) {
      if (kid == null || kid === false) return;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    });
    return el;
  }

  /* ---------- state ---------- */
  var entries = [];
  var loaded = false;
  var loadSlow = false;
  var aiOk = null;
  var selected = null;        // {type:'entry'|'topic', id}
  var pendingDel = null;      // 'entry:ID' | 'topic:NAME'
  var inFlight = new Set();
  var writeQ = new Map();
  var notice = '';
  var noticeTimer = null;
  var focusTopicInput = false;
  var hueMap = new Map();

  var now = Date.now();
  var DEMO = [
    ['Sabah yürüyüşü yapınca gün boyu daha az dağınık hissediyorum.', ['Alışkanlıklar', 'Odak']],
    ['Telefonu başka odada bırakınca ders çalışmak çok daha kolay.', ['Odak', 'Alışkanlıklar']],
    ['Oyun teorisinde işbirliği, tekrar eden oyunlarda daha kolay ortaya çıkıyor.', ['Oyun Teorisi', 'İşbirliği']],
    ['Mahkûm ikilemi aslında bir güven meselesi.', ['Oyun Teorisi', 'İşbirliği']],
    ['Ekip toplantıları kısa olunca karar kalitesi düşmüyor.', ['İşbirliği', 'Çalışma Düzeni']],
    ['Gece çalışmak verimli ama ertesi gün bedelini ödüyorum.', ['Çalışma Düzeni', 'Uyku']],
    ['Uyku düzenim bozulunca motivasyonum da düşüyor.', ['Uyku', 'Alışkanlıklar']]
  ].map(function (d, i) {
    return { id: 'demo' + i, text: d[0], topics: d[1], status: 'done', ts: now - (i + 1) * 130000000, demo: true };
  });

  var isDemo = function () { return loaded && entries.length === 0; };
  var list = function () { return isDemo() ? DEMO : entries; };

  function hueFor(name) {
    if (!hueMap.has(name)) hueMap.set(name, HUES[hueMap.size % HUES.length]);
    return hueMap.get(name);
  }
  function topicsOf(L) {
    var m = new Map();
    L.slice().sort(function (a, b) { return a.ts - b.ts; }).forEach(function (e) {
      e.topics.forEach(function (t) { m.set(t, (m.get(t) || 0) + 1); hueFor(t); });
    });
    return m;
  }
  function topicNames() {
    var m = new Map();
    entries.forEach(function (e) { e.topics.forEach(function (t) { m.set(t, (m.get(t) || 0) + 1); }); });
    return Array.from(m.entries())
      .sort(function (a, b) { return b[1] - a[1] || a[0].localeCompare(b[0], 'tr'); })
      .map(function (x) { return x[0]; });
  }
  function cleanTopic(s) {
    s = String(s || '').trim().replace(/\s+/g, ' ').slice(0, 32);
    if (!s) return '';
    var hit = topicNames().find(function (x) { return lc(x) === lc(s); });
    return hit || (s.charAt(0).toLocaleUpperCase('tr') + s.slice(1));
  }
  function dstatus(e) {
    if (inFlight.has(e.id)) return 'pending';
    if (e.topics.length) return 'done';
    if (e.status === 'pending') return 'failed';
    return e.status || 'manual';
  }
  function fmtDate(ts) {
    var d = new Date(ts);
    return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long' }) + ', ' +
      d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  }
  function snippet(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function newId() { return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function normalizeEntry(id, d) {
    if (!d || typeof d.text !== 'string') return null;
    return {
      id: id,
      text: d.text,
      topics: Array.isArray(d.topics) ? d.topics.filter(function (t) { return typeof t === 'string' && t; }) : [],
      status: typeof d.status === 'string' ? d.status : 'done',
      ts: typeof d.ts === 'number' ? d.ts : 0
    };
  }

  /* ---------- storage (Supabase) ---------- */
  var sb = null;
  var currentUid = null;
  var signedEmail = '';

  function enqueue(id, fn) {
    var prev = writeQ.get(id) || Promise.resolve();
    var next = prev.catch(function () {}).then(fn);
    writeQ.set(id, next);
    next.catch(function () {}).then(function () { if (writeQ.get(id) === next) writeQ.delete(id); });
    return next;
  }
  function writeFailed() {
    say('Kaydedilemedi. Bağlantını kontrol edip tekrar dene.', true);
  }
  function persist(id, fn) {
    if (!sb || !currentUid) return Promise.resolve();
    return enqueue(id, fn).catch(writeFailed);
  }
  function rowOf(e) {
    return { id: e.id, user_id: currentUid, text: e.text, topics: e.topics, status: e.status, ts: e.ts };
  }
  function createEntry(e) {
    entries.push(e); render();
    return persist(e.id, async function () {
      var r = await sb.from('entries').upsert(rowOf(e));
      if (r.error) throw r.error;
    });
  }
  function patch(id, fields) {
    var e = entries.find(function (x) { return x.id === id; });
    if (!e) return Promise.resolve();
    Object.assign(e, fields); render();
    return persist(id, async function () {
      var r = await sb.from('entries').update(fields).eq('id', id);
      if (r.error) throw r.error;
    });
  }
  function removeEntry(id) {
    entries = entries.filter(function (x) { return x.id !== id; }); render();
    return persist(id, async function () {
      var r = await sb.from('entries').delete().eq('id', id);
      if (r.error) throw r.error;
    });
  }

  /* ---------- topic assignment (sunucudaki /api/topics üzerinden Claude) ---------- */
  function normalizeTopics(res) {
    var arr = Array.isArray(res) ? res : (res && Array.isArray(res.topics) ? res.topics : []);
    var out = [];
    arr.forEach(function (t) {
      if (typeof t !== 'string' || out.length >= 3) return;
      var c = cleanTopic(t);
      if (c && !out.some(function (x) { return lc(x) === lc(c); })) out.push(c);
    });
    return out;
  }
  async function askTopics(text) {
    var s = (await sb.auth.getSession()).data.session;
    if (!s) throw { code: 'session_expired' };
    var r = await fetch('/api/topics', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + s.access_token },
      body: JSON.stringify({ text: text, known: topicNames().slice(0, 60) })
    });
    if (r.status === 429) throw { code: 'rate_limited' };
    if (!r.ok) throw { code: 'upstream_error' };
    var j = await r.json();
    return j.topics;
  }

  async function assign(id, text) {
    inFlight.add(id); render();
    try {
      var found = normalizeTopics(await askTopics(text));
      if (!found.length) throw { code: 'empty' };
      var cur = entries.find(function (x) { return x.id === id; });
      if (cur) await patch(id, { topics: uniq(cur.topics.concat(found)), status: 'done' });
    } catch (err) {
      var code = err && err.code;
      await patch(id, { status: 'failed' });
      say(code === 'rate_limited' ? 'Bugünlük başlık atama hakkın doldu. Başlıkları elle ekleyebilirsin.'
        : 'Başlık atanamadı. Düşünceyi açıp tekrar deneyebilirsin.', true);
    } finally {
      inFlight.delete(id); render();
    }
  }

  /* ---------- topic edits ---------- */
  function getEntry(id) { return entries.find(function (x) { return x.id === id; }); }
  function addTopic(id, name) {
    var e = getEntry(id); if (!e) return;
    focusTopicInput = true;
    patch(id, { topics: uniq(e.topics.concat([name])) });
  }
  function dropTopic(id, name) {
    var e = getEntry(id); if (!e) return;
    patch(id, { topics: e.topics.filter(function (t) { return t !== name; }) });
  }
  async function renameTopic(oldN, raw) {
    var nn = cleanTopic(raw);
    if (!nn || nn === oldN) return;
    var hit = topicNames().find(function (x) { return lc(x) === lc(nn) && x !== oldN; });
    if (hit) nn = hit;
    var targets = entries.filter(function (e) { return e.topics.indexOf(oldN) >= 0; });
    selected = { type: 'topic', id: nn };
    for (var i = 0; i < targets.length; i++) {
      var t = targets[i];
      await patch(t.id, { topics: uniq(t.topics.map(function (x) { return x === oldN ? nn : x; })) });
    }
  }
  async function removeTopicEverywhere(name) {
    var targets = entries.filter(function (e) { return e.topics.indexOf(name) >= 0; });
    selected = null; pendingDel = null;
    for (var i = 0; i < targets.length; i++) {
      var t = targets[i];
      await patch(t.id, { topics: t.topics.filter(function (x) { return x !== name; }) });
    }
  }

  /* ---------- notices ---------- */
  function say(msg, warn) {
    notice = msg; noticeIsWarn = !!warn;
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(function () { notice = ''; renderNote(); }, 8000);
    renderNote();
  }
  var noticeIsWarn = false;

  /* ---------- DOM refs ---------- */
  var statsEl = document.getElementById('stats');
  var chipsEl = document.getElementById('chips');
  var graphEl = document.getElementById('graph');
  var badgeEl = document.getElementById('badge');
  var overlayEl = document.getElementById('overlay');
  var whereEl = document.getElementById('where');
  var noteEl = document.getElementById('note');
  var detailEl = document.getElementById('detail');
  var composer = document.getElementById('composer');
  var ta = document.getElementById('entry-text');
  var resetBtn = document.getElementById('reset');

  /* ---------- graph ---------- */
  var nodes = [], nodeSel = null, linkSel = null, sim = null, svg = null, zoomLayer = null, zoomBehavior = null;
  var W = 600, H = 480;
  var lastStructSig = '';

  if (hasD3) {
    svg = d3.select('#svg');
    zoomLayer = svg.append('g');
    var linkLayer = zoomLayer.append('g').attr('class', 'links');
    var nodeLayer = zoomLayer.append('g').attr('class', 'nodes');
    linkSel = linkLayer.selectAll('line');
    nodeSel = nodeLayer.selectAll('g');

    zoomBehavior = d3.zoom().scaleExtent([0.35, 3]).on('zoom', function (ev) { zoomLayer.attr('transform', ev.transform); });
    svg.call(zoomBehavior);
    svg.on('click', function (ev) {
      if (ev.target === svg.node()) { selected = null; pendingDel = null; render(); }
    });

    sim = d3.forceSimulation()
      .force('link', d3.forceLink().id(function (d) { return d.id; }).distance(66).strength(0.7))
      .force('charge', d3.forceManyBody().strength(function (d) { return d.type === 'topic' ? -340 : -70; }))
      .force('collide', d3.forceCollide().radius(function (d) { return d.r + (d.type === 'topic' ? 18 : 4); }))
      .force('x', d3.forceX().strength(0.045))
      .force('y', d3.forceY().strength(0.045))
      .on('tick', function () {
        linkSel.attr('x1', function (d) { return d.source.x; }).attr('y1', function (d) { return d.source.y; })
          .attr('x2', function (d) { return d.target.x; }).attr('y2', function (d) { return d.target.y; });
        nodeSel.attr('transform', function (d) { return 'translate(' + d.x + ',' + d.y + ')'; });
      });

    resetBtn.addEventListener('click', function () {
      svg.transition().duration(300).call(zoomBehavior.transform, d3.zoomIdentity);
    });

    var ro = new ResizeObserver(function () {
      var r = graphEl.getBoundingClientRect();
      if (r.width < 10 || r.height < 10) return;
      W = r.width; H = r.height;
      svg.attr('viewBox', (-W / 2) + ' ' + (-H / 2) + ' ' + W + ' ' + H);
      sim.alpha(0.2).restart();
    });
    ro.observe(graphEl);
  } else {
    resetBtn.hidden = true;
  }

  var drag = hasD3 ? d3.drag()
    .on('start', function (ev, d) { if (!ev.active) sim.alphaTarget(0.25).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', function (ev, d) { d.fx = ev.x; d.fy = ev.y; })
    .on('end', function (ev, d) { if (!ev.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }) : null;

  function pickNode(d) {
    selected = d.type === 'topic' ? { type: 'topic', id: d.name } : { type: 'entry', id: d.entry.id };
    pendingDel = null;
    render();
    if (window.matchMedia('(max-width:860px)').matches) {
      var calm = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
      detailEl.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' });
    }
  }

  function focusSet() {
    if (!selected) return null;
    var L = list(), s = new Set();
    if (selected.type === 'topic') {
      s.add('t:' + selected.id);
      L.forEach(function (e) { if (e.topics.indexOf(selected.id) >= 0) s.add('e:' + e.id); });
    } else {
      var e = L.find(function (x) { return x.id === selected.id; });
      if (!e) return null;
      s.add('e:' + e.id);
      e.topics.forEach(function (t) {
        s.add('t:' + t);
        L.forEach(function (o) { if (o.topics.indexOf(t) >= 0) s.add('e:' + o.id); });
      });
    }
    return s;
  }

  function applyClasses() {
    if (!hasD3) return;
    var fs = focusSet();
    nodeSel.attr('class', function (d) {
      var sel = selected && ((d.type === 'topic' && selected.type === 'topic' && selected.id === d.name) ||
        (d.type === 'entry' && selected.type === 'entry' && selected.id === d.entry.id));
      return ['node', d.type,
        d.status === 'pending' ? 'pending' : '',
        d.type === 'entry' && d.hue == null ? 'orphan' : '',
        sel ? 'sel' : '',
        fs && !fs.has(d.id) ? 'dim' : ''].filter(Boolean).join(' ');
    }).attr('style', function (d) { return d.hue != null ? '--h:' + d.hue : null; });
    linkSel.attr('class', function (d) {
      return fs && !(fs.has(idOf(d.source)) && fs.has(idOf(d.target))) ? 'dim' : null;
    });
  }

  function renderGraph() {
    if (!hasD3) {
      overlayEl.textContent = 'Grafik kitaplığı yüklenemedi. Başlıkları ve düşünceleri yandaki listeden kullanabilirsin.';
      return;
    }
    var L = list();
    var sig = JSON.stringify(L.map(function (e) { return [e.id, e.topics, dstatus(e)]; }));
    if (sig !== lastStructSig) {
      lastStructSig = sig;
      var tm = topicsOf(L);
      var old = new Map(nodes.map(function (n) { return [n.id, n]; }));
      var nn = [], ll = [];
      tm.forEach(function (count, name) {
        var id = 't:' + name, o = old.get(id) || {};
        nn.push({ id: id, type: 'topic', name: name, count: count, hue: hueFor(name),
          r: Math.min(46, 15 + 6 * Math.sqrt(count)), x: o.x, y: o.y, vx: o.vx, vy: o.vy });
      });
      L.forEach(function (e) {
        var id = 'e:' + e.id, o = old.get(id) || {};
        var node = { id: id, type: 'entry', entry: e, status: dstatus(e),
          hue: e.topics.length ? hueFor(e.topics[0]) : null, r: 6, x: o.x, y: o.y, vx: o.vx, vy: o.vy };
        if (node.x == null && e.topics.length) {
          var host = nn.find(function (n) { return n.id === 't:' + e.topics[0] && n.x != null; });
          if (host) { node.x = host.x + (Math.random() - 0.5) * 40; node.y = host.y + (Math.random() - 0.5) * 40; }
        }
        nn.push(node);
        e.topics.forEach(function (t) { ll.push({ source: id, target: 't:' + t, key: id + '>' + t }); });
      });
      nodes = nn;

      linkSel = linkLayer.selectAll('line').data(ll, function (d) { return d.key; }).join('line');
      nodeSel = nodeLayer.selectAll('g.node').data(nn, function (d) { return d.id; }).join(function (enter) {
        var g = enter.append('g');
        g.append('circle');
        g.append('text').attr('class', 'count');
        g.append('text').attr('class', 'label');
        g.append('title');
        g.call(drag).on('click', function (ev, d) { pickNode(d); });
        return g;
      });
      nodeSel.select('circle').attr('r', function (d) { return d.r; });
      nodeSel.select('text.count').text(function (d) { return d.type === 'topic' ? d.count : ''; });
      nodeSel.select('text.label').text(function (d) { return d.type === 'topic' ? d.name : ''; })
        .attr('y', function (d) { return d.r + 15; });
      nodeSel.select('title').text(function (d) {
        return d.type === 'topic' ? d.name + ' (' + d.count + ')' : snippet(d.entry.text, 80);
      });

      sim.nodes(nn);
      sim.force('link').links(ll);
      sim.alpha(0.6).restart();
    }
    applyClasses();
  }

  /* ---------- panels ---------- */
  function renderStats() {
    var real = entries.length, tcount = topicNames().length;
    statsEl.textContent = isDemo() ? 'Örnek görünüm' : (!loaded ? '' : real + ' düşünce · ' + tcount + ' başlık');
    whereEl.textContent = signedEmail ? 'Giriş: ' + signedEmail : '';
    badgeEl.hidden = !isDemo();
    overlayEl.textContent = loaded ? (hasD3 ? '' : overlayEl.textContent)
      : (loadSlow ? 'Kayıtlara şu an ulaşılamıyor. Bağlantı gelince düşüncelerin yüklenecek.' : 'Düşünceler yükleniyor…');
  }

  function renderChips() {
    var tm = topicsOf(list());
    var arr = Array.from(tm.entries()).sort(function (a, b) { return b[1] - a[1] || a[0].localeCompare(b[0], 'tr'); });
    var kids = arr.length ? arr.map(function (p) {
      var name = p[0], on = selected && selected.type === 'topic' && selected.id === name;
      return h('button', {
        class: 'tchip' + (on ? ' on' : ''), type: 'button', style: '--h:' + hueFor(name),
        'aria-pressed': on ? 'true' : 'false',
        onclick: function () { selected = on ? null : { type: 'topic', id: name }; pendingDel = null; render(); }
      }, h('span', { class: 'dot' }), name, h('span', { class: 'n', text: p[1] }));
    }) : [h('span', { class: 'empty-chips', text: loaded ? 'Başlıklar burada görünecek.' : '' })];
    chipsEl.replaceChildren.apply(chipsEl, kids);
  }

  function renderNote() {
    var text, warn = false;
    if (notice) { text = notice; warn = noticeIsWarn; }
    else if (aiOk === false) text = 'Yapay zekâ bu görünümde kapalı. Başlıkları kendin ekleyebilirsin.';
    else if (aiOk) text = 'Başlık atamak için düşüncen Claude’a gönderilir.';
    else text = '';
    noteEl.textContent = text;
    noteEl.className = 'note' + (warn ? ' warn' : '');
  }

  function tag(name, onRemove) {
    return h('span', { class: 'tag', style: '--h:' + hueFor(name) }, name,
      onRemove ? h('button', { type: 'button', 'aria-label': name + ' başlığını kaldır', onclick: onRemove }, '×') : null);
  }

  function entryItem(e, shared) {
    var st = dstatus(e);
    var tags = (shared || e.topics).map(function (t) { return tag(t); });
    var state = st === 'pending' ? h('span', { class: 'state', text: 'Başlık aranıyor…' })
      : st === 'failed' ? h('span', { class: 'state warn', text: 'Başlık atanamadı' })
      : (!e.topics.length ? h('span', { class: 'state', text: 'Başlıksız' }) : null);
    return h('button', {
      class: 'item', type: 'button',
      onclick: function () { selected = { type: 'entry', id: e.id }; pendingDel = null; render(); }
    }, h('span', { class: 'tx', text: e.text }), h('span', { class: 'tags' }, tags, state));
  }

  function listView() {
    var L = list().slice().sort(function (a, b) { return b.ts - a.ts; });
    var out = [h('h2', { text: isDemo() ? 'Örnek düşünceler' : 'Son düşünceler' })];
    if (!L.length) out.push(h('p', { class: 'muted', text: loaded ? 'Henüz düşünce yok. Yukarıdaki kutuya ilkini yaz.' : '' }));
    L.slice(0, 12).forEach(function (e) { out.push(entryItem(e)); });
    if (L.length > 12) out.push(h('p', { class: 'muted', text: 'Diğer ' + (L.length - 12) + ' düşünce grafikte.' }));
    return out;
  }

  function backBtn() {
    return h('button', { class: 'btn back', type: 'button',
      onclick: function () { selected = null; pendingDel = null; render(); } }, '← Tüm düşünceler');
  }

  function entryView(e) {
    var demo = !!e.demo, st = dstatus(e);
    var stateText = st === 'pending' ? ' · Başlık aranıyor…' : st === 'failed' ? ' · Başlık atanamadı'
      : (!e.topics.length ? ' · Başlıksız' : '');
    var out = [
      backBtn(),
      h('p', { class: 'etext', text: e.text }),
      h('p', { class: 'meta', text: fmtDate(e.ts) + stateText }),
      h('div', { class: 'tags' }, e.topics.map(function (t) { return tag(t, demo ? null : function () { dropTopic(e.id, t); }); }))
    ];

    if (!demo) {
      var input = h('input', { id: 'topic-input', type: 'text', list: 'topic-list', maxlength: '32',
        autocomplete: 'off', placeholder: 'Başlık ekle', 'aria-label': 'Başlık ekle' });
      out.push(h('form', {
        class: 'inline',
        onsubmit: function (ev) {
          ev.preventDefault();
          var v = cleanTopic(input.value);
          if (v) { input.value = ''; addTopic(e.id, v); }
        }
      }, input, h('button', { class: 'btn', type: 'submit' }, 'Ekle'),
        h('datalist', { id: 'topic-list' }, topicNames().map(function (n) { return h('option', { value: n }); }))));
    }

    var rel = [];
    list().forEach(function (o) {
      if (o.id === e.id) return;
      var shared = o.topics.filter(function (t) { return e.topics.indexOf(t) >= 0; });
      if (shared.length) rel.push({ o: o, shared: shared });
    });
    rel.sort(function (a, b) { return b.shared.length - a.shared.length || b.o.ts - a.o.ts; });
    out.push(h('div', { class: 'section' },
      h('h2', { text: 'Bağlantılı düşünceler' }),
      rel.length ? rel.map(function (r) { return entryItem(r.o, r.shared); })
        : h('p', { class: 'muted', text: e.topics.length ? 'Bu başlıkları paylaşan başka düşünce yok.' : 'Başlık eklenince bağlantılı düşünceler burada görünür.' })));

    if (!demo) {
      var row = h('div', { class: 'row' });
      if (aiOk && st !== 'pending') {
        row.append(h('button', { class: 'btn', type: 'button', onclick: function () { assign(e.id, e.text); } }, 'Yapay zekâdan başlık iste'));
      }
      if (pendingDel === 'entry:' + e.id) {
        row.append(h('span', { class: 'confirm' }, 'Bu düşünce silinsin mi?',
          h('button', { class: 'btn danger', type: 'button', onclick: function () { selected = null; pendingDel = null; removeEntry(e.id); } }, 'Sil'),
          h('button', { class: 'btn', type: 'button', onclick: function () { pendingDel = null; render(); } }, 'Vazgeç')));
      } else {
        row.append(h('button', { class: 'btn danger', type: 'button', onclick: function () { pendingDel = 'entry:' + e.id; render(); } }, 'Düşünceyi sil'));
      }
      out.push(row);
    }
    return out;
  }

  function topicView(name) {
    var demo = isDemo();
    var L = list().filter(function (e) { return e.topics.indexOf(name) >= 0; }).sort(function (a, b) { return b.ts - a.ts; });
    var out = [
      backBtn(),
      h('h3', { text: name }),
      h('p', { class: 'meta', text: L.length + ' düşünce' })
    ];
    if (!demo) {
      var input = h('input', { id: 'rename-input', type: 'text', maxlength: '32', autocomplete: 'off',
        value: name, 'aria-label': 'Başlığı yeniden adlandır' });
      out.push(h('form', {
        class: 'inline',
        onsubmit: function (ev) { ev.preventDefault(); renameTopic(name, input.value); }
      }, input, h('button', { class: 'btn', type: 'submit' }, 'Adı değiştir')));
    }
    out.push(h('div', { class: 'section' }, L.map(function (e) { return entryItem(e); })));
    if (!demo) {
      var row = h('div', { class: 'row' });
      if (pendingDel === 'topic:' + name) {
        row.append(h('span', { class: 'confirm' }, 'Başlık tüm düşüncelerden kaldırılsın mı?',
          h('button', { class: 'btn danger', type: 'button', onclick: function () { removeTopicEverywhere(name); } }, 'Kaldır'),
          h('button', { class: 'btn', type: 'button', onclick: function () { pendingDel = null; render(); } }, 'Vazgeç')));
      } else {
        row.append(h('button', { class: 'btn danger', type: 'button', onclick: function () { pendingDel = 'topic:' + name; render(); } }, 'Başlığı kaldır'));
      }
      out.push(row);
    }
    return out;
  }

  var lastDetailSig = '';
  function renderDetail() {
    var L = list();
    var sig = JSON.stringify([selected, pendingDel, isDemo(), loaded, aiOk,
      L.map(function (e) { return [e.id, e.text.length, e.topics, dstatus(e)]; })]);
    if (sig === lastDetailSig) return;
    lastDetailSig = sig;
    var kids;
    if (selected && selected.type === 'entry') {
      var e = L.find(function (x) { return x.id === selected.id; });
      kids = e ? entryView(e) : listView();
    } else if (selected && selected.type === 'topic') {
      kids = topicView(selected.id);
    } else kids = listView();
    detailEl.replaceChildren.apply(detailEl, kids);
    if (focusTopicInput) {
      var inp = document.getElementById('topic-input');
      if (inp) inp.focus();
      focusTopicInput = false;
    }
  }

  function validateSelection() {
    if (!selected) return;
    var L = list();
    if (selected.type === 'entry' && !L.some(function (e) { return e.id === selected.id; })) selected = null;
    else if (selected.type === 'topic' && !topicsOf(L).has(selected.id)) selected = null;
  }

  function render() {
    validateSelection();
    renderStats();
    renderChips();
    renderGraph();
    renderDetail();
    renderNote();
  }

  /* ---------- composer ---------- */
  composer.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var text = ta.value.trim();
    if (!text) return;
    ta.value = '';
    var e = { id: newId(), text: text, topics: [], status: 'pending', ts: Date.now() };
    createEntry(e).then(function () { return assign(e.id, e.text); });
  });
  ta.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); composer.requestSubmit(); }
  });

  /* ---------- boot ---------- */
  var CFG = window.DUSUNCE_CONFIG || {};
  var authEl = document.getElementById('auth');
  var appEl = document.getElementById('app');
  var authForm = document.getElementById('auth-form');
  var authEmail = document.getElementById('auth-email');
  var authPass = document.getElementById('auth-pass');
  var authMsg = document.getElementById('auth-msg');
  var signupBtn = document.getElementById('signup');
  var logoutBtn = document.getElementById('logout');

  function authSay(msg, warn) {
    authMsg.textContent = msg || '';
    authMsg.className = 'note' + (warn ? ' warn' : '');
  }
  function showAuth() { authEl.hidden = false; appEl.hidden = true; logoutBtn.hidden = true; }

  var configured = CFG.supabaseUrl && CFG.supabaseAnonKey && CFG.supabaseUrl.indexOf('YOUR-') < 0 && window.supabase;
  if (!configured) {
    showAuth();
    authSay(window.supabase
      ? 'config.js dosyasına Supabase adresini ve anahtarını yazman gerekiyor. README.md’deki 4. adıma bak.'
      : 'Supabase kitaplığı yüklenemedi. İnternet bağlantını kontrol et.', true);
    authForm.querySelectorAll('input,button').forEach(function (el) { el.disabled = true; });
    return;
  }

  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);

  async function onSession(session) {
    if (!session) {
      currentUid = null; signedEmail = ''; entries = []; loaded = false; aiOk = null;
      selected = null; pendingDel = null; lastStructSig = ''; lastDetailSig = '';
      showAuth();
      return;
    }
    if (session.user.id === currentUid) return;
    currentUid = session.user.id;
    signedEmail = session.user.email || '';
    authEl.hidden = true; appEl.hidden = false; logoutBtn.hidden = false;
    authSay('');
    aiOk = true; loaded = false; entries = [];
    lastStructSig = ''; lastDetailSig = '';
    render();
    var uid = currentUid;
    var slow = setTimeout(function () { if (!loaded) { loadSlow = true; render(); } }, 10000);
    var r = await sb.from('entries').select('id,text,topics,status,ts').order('ts', { ascending: true });
    clearTimeout(slow);
    if (uid !== currentUid) return;
    loaded = true; loadSlow = false;
    if (r.error) say('Düşünceler yüklenemedi. Sayfayı yenileyip tekrar dene.', true);
    else entries = r.data.map(function (d) { return normalizeEntry(d.id, d); }).filter(Boolean);
    render();
  }

  sb.auth.onAuthStateChange(function (_ev, session) {
    setTimeout(function () { onSession(session); }, 0);
  });

  authForm.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    authSay('Giriş yapılıyor…');
    var r = await sb.auth.signInWithPassword({ email: authEmail.value.trim(), password: authPass.value });
    if (r.error) authSay('Giriş yapılamadı: ' + r.error.message, true);
  });
  signupBtn.addEventListener('click', async function () {
    if (!authForm.reportValidity()) return;
    authSay('Hesap oluşturuluyor…');
    var r = await sb.auth.signUp({
      email: authEmail.value.trim(), password: authPass.value,
      options: { emailRedirectTo: window.location.origin }
    });
    if (r.error) authSay('Kayıt olunamadı: ' + r.error.message, true);
    else if (!r.data.session) authSay('E-postana bir onay linki gönderildi. Linke tıkladıktan sonra giriş yap.');
  });
  logoutBtn.addEventListener('click', function () { sb.auth.signOut(); });
})();
</script>
</body>
</html>
